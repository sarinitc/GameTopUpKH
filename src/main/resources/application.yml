spring:
  application:
    name: GameTopUp-KH

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  # PaaS providers (Render, Heroku, Cloud Run) inject PORT; Compose sets
  # SERVER_PORT. Local runs fall back to 8082.
  port: ${PORT:${SERVER_PORT:8082}}
  address: 0.0.0.0

management:
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      exposure:
        # health is the only endpoint required by the platform health check.
        # info and metrics are additionally exposed but require an ADMIN token
        # in SecurityConfig.
        include: health,info,metrics
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      # Anonymous callers only receive {"status":"UP|DOWN"} (never details such
      # as the JDBC URL or credentials). Component details require an ADMIN.
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        liveness:
          # Liveness must not depend on the database, so a Neon outage cannot
          # make the platform restart an otherwise healthy process.
          include: livenessState
        readiness:
          include: readinessState,db
    info:
      access: read-only
    metrics:
      access: read-only
  info:
    defaults:
      enabled: false
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Cambodian game-credit storefront backend
    version: "@project.version@"

app:
  admin-bootstrap:
    # One-time, server-side first-ADMIN provisioning. Keep disabled. When enabled,
    # email must name an existing ACTIVE account that has completed email or phone
    # verification, and confirmation must be exactly GRANT_ADMIN. Remove or disable
    # these values immediately after the grant; there is no HTTP endpoint for this.
    enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${APP_ADMIN_BOOTSTRAP_EMAIL:}
    confirmation: ${APP_ADMIN_BOOTSTRAP_CONFIRM:}
  dev-tools:
    # Development-only mutation routes (mock payment confirmation and mock delivery).
    # They are disabled by default so a production deployment cannot expose them by accident.
    enabled: ${APP_DEV_TOOLS_ENABLED:false}
  openapi:
    # Local development keeps Swagger UI/OpenAPI public. application-prod.yml
    # overrides this to false, so opt-in production docs require an ADMIN token.
    public: true
  cors:
    # Comma-separated exact browser origins allowed to call /api/**.
    # Empty disables cross-origin browser access; a wildcard is rejected at startup.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET}
    issuer: gametopup-api
    access-token-expiration: 15m
    refresh-token-expiration: 7d
  password-reset:
    token-expiration: ${PASSWORD_RESET_TOKEN_EXPIRATION:10m}
    resend-cooldown: ${PASSWORD_RESET_RESEND_COOLDOWN:60s}
    frontend-base-url: ${PASSWORD_RESET_FRONTEND_BASE_URL:http://localhost:3000}
    reset-path: ${PASSWORD_RESET_PATH:/reset-password}
    rate-limit-window: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:15m}
    requests-per-email-per-window: ${PASSWORD_RESET_REQUESTS_PER_EMAIL:3}
    requests-per-ip-per-window: ${PASSWORD_RESET_REQUESTS_PER_IP:10}
    reset-attempts-per-ip-per-window: ${PASSWORD_RESET_RESET_ATTEMPTS_PER_IP:10}
    cleanup-enabled: ${PASSWORD_RESET_CLEANUP_ENABLED:true}
    cleanup-interval: ${PASSWORD_RESET_CLEANUP_INTERVAL:PT1H}
    cleanup-retention: ${PASSWORD_RESET_CLEANUP_RETENTION:P7D}

payment:
  gateway: ${PAYMENT_GATEWAY:mock}
  aba:
    environment: ${ABA_PAYWAY_ENVIRONMENT:sandbox}
    live-payments-enabled: ${ABA_PAYWAY_LIVE_PAYMENTS_ENABLED:false}
    base-url: ${ABA_PAYWAY_BASE_URL:https://checkout-sandbox.payway.com.kh}
    merchant-id: ${ABA_PAYWAY_MERCHANT_ID:}
    api-key: ${ABA_PAYWAY_API_KEY:}
    create-path: ${ABA_PAYWAY_CREATE_PATH:/api/payment-gateway/v1/payments/generate-qr}
    status-path: ${ABA_PAYWAY_STATUS_PATH:/api/payment-gateway/v1/payments/check-transaction-2}
    purchase-path: ${ABA_PAYWAY_PURCHASE_PATH:/api/payment-gateway/v1/payments/purchase}
    payment-option: ${ABA_PAYWAY_PAYMENT_OPTION:abapay_khqr}
    qr-image-template: ${ABA_PAYWAY_QR_IMAGE_TEMPLATE:template3_color}
    lifetime-minutes: ${ABA_PAYWAY_LIFETIME_MINUTES:30}
    callback-url: ${ABA_PAYWAY_CALLBACK_URL:http://localhost:8082/api/v1/payments/aba/callback}
    callback-secret: ${ABA_PAYWAY_CALLBACK_SECRET:}
    connect-timeout: ${ABA_PAYWAY_CONNECT_TIMEOUT:5s}
    read-timeout: ${ABA_PAYWAY_READ_TIMEOUT:15s}
    max-retries: ${ABA_PAYWAY_MAX_RETRIES:2}
  bakong:
    environment: ${BAKONG_ENVIRONMENT:production}
    enabled: ${BAKONG_LIVE_ENABLED:${BAKONG_PAYMENT_ENABLED:false}}
    base-url: ${BAKONG_BASE_URL:}
    api-token: ${BAKONG_TOKEN:${BAKONG_API_TOKEN:}}
    account-id: ${BAKONG_ACCOUNT_ID:}
    merchant-name: ${BAKONG_MERCHANT_NAME:GameTopUp-KH}
    merchant-city: ${BAKONG_MERCHANT_CITY:Phnom Penh}
    lifetime-minutes: ${BAKONG_LIFETIME_MINUTES:10}
    connect-timeout: ${BAKONG_CONNECT_TIMEOUT:5s}
    read-timeout: ${BAKONG_READ_TIMEOUT:15s}
    max-retries: ${BAKONG_MAX_RETRIES:2}
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
    batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:50}
    fixed-delay: ${PAYMENT_RECONCILIATION_FIXED_DELAY:PT1M}
    initial-delay: ${PAYMENT_RECONCILIATION_INITIAL_DELAY:PT30S}
    min-age: ${PAYMENT_RECONCILIATION_MIN_AGE:PT1M}
  reconcile:
    cooldown: ${PAYMENT_RECONCILE_COOLDOWN:PT30S}

supplier:
  client: ${SUPPLIER_CLIENT:mock}
  max-attempts: ${SUPPLIER_MAX_ATTEMPTS:3}
  bay2game:
    enabled: ${BAY2GAME_ENABLED:false}
    provider-confirmed: ${BAY2GAME_PROVIDER_CONFIRMED:false}
    connect-timeout: ${BAY2GAME_CONNECT_TIMEOUT:3s}
    read-timeout: ${BAY2GAME_READ_TIMEOUT:10s}
  mock:
    fail: ${SUPPLIER_MOCK_FAIL:false}

fulfillment:
  worker:
    enabled: ${FULFILLMENT_WORKER_ENABLED:true}
    batch-size: ${FULFILLMENT_WORKER_BATCH_SIZE:50}
    fixed-delay: ${FULFILLMENT_WORKER_FIXED_DELAY:PT30S}
    initial-delay: ${FULFILLMENT_WORKER_INITIAL_DELAY:PT30S}

player:
  verification:
    # Outer bound for the whole lookup. Keep it above the Volsever read timeout.
    timeout: ${PLAYER_VERIFICATION_TIMEOUT:5s}
    volsever:
      # Disabled unless the deployment opts in. Production enables it by default.
      # VOLSEVER_API_KEY comes from the backend environment, never from source.
      enabled: ${VOLSEVER_ENABLED:false}
      base-url: ${VOLSEVER_BASE_URL:https://gate.volsever.com}
      free-fire-path: ${VOLSEVER_FREE_FIRE_PATH:/proxy/api/game/free-fire-global}
      mobile-legends-path: ${VOLSEVER_MOBILE_LEGENDS_PATH:/proxy/api/game/mobile-legends}
      connect-timeout: ${VOLSEVER_CONNECT_TIMEOUT:2s}
      read-timeout: ${VOLSEVER_READ_TIMEOUT:4s}
