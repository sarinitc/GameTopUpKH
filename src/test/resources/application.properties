# Test-only defaults. Never import the development .env or use its database.
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:legacy-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:test-roles.sql
app.jwt.secret=isolated-automated-test-key-at-least-thirty-two-bytes
app.dev-tools.enabled=true
# Required by application-prod.yml placeholders when a test activates the prod profile.
APP_PASSWORD_RESET_FRONTEND_BASE_URL=https://example.test
payment.gateway=mock
payment.aba.base-url=http://127.0.0.1:1
payment.aba.api-key=
payment.aba.merchant-id=
payment.aba.callback-secret=
supplier.client=mock
supplier.mock.fail=false
payment.reconciliation.enabled=false
fulfillment.worker.enabled=false
app.password-reset.cleanup-enabled=false
app.password-reset.requests-per-email-per-window=3
app.password-reset.requests-per-ip-per-window=100
app.password-reset.reset-attempts-per-ip-per-window=100
spring.test.mockmvc.print=none
