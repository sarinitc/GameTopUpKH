spring:
  application:
    name: GameTopUp-KH

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8082

management:
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      exposure:
        include: health,info,metrics
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
    info:
      access: read-only
    metrics:
      access: read-only
  info:
    defaults:
      enabled: false
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Cambodian game-credit storefront backend
    version: "@project.version@"

app:
  dev-tools:
    # Development-only mutation routes (mock payment confirmation and mock delivery).
    # They are disabled by default so a production deployment cannot expose them by accident.
    enabled: ${APP_DEV_TOOLS_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    issuer: gametopup-api
    access-token-expiration: 15m
    refresh-token-expiration: 7d
  password-reset:
    token-expiration: ${PASSWORD_RESET_TOKEN_EXPIRATION:10m}
    resend-cooldown: ${PASSWORD_RESET_RESEND_COOLDOWN:60s}
    frontend-base-url: ${PASSWORD_RESET_FRONTEND_BASE_URL:http://localhost:3000}
    reset-path: ${PASSWORD_RESET_PATH:/reset-password}
    rate-limit-window: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:15m}
    requests-per-email-per-window: ${PASSWORD_RESET_REQUESTS_PER_EMAIL:3}
    requests-per-ip-per-window: ${PASSWORD_RESET_REQUESTS_PER_IP:10}
    reset-attempts-per-ip-per-window: ${PASSWORD_RESET_RESET_ATTEMPTS_PER_IP:10}
    cleanup-enabled: ${PASSWORD_RESET_CLEANUP_ENABLED:true}
    cleanup-interval: ${PASSWORD_RESET_CLEANUP_INTERVAL:PT1H}
    cleanup-retention: ${PASSWORD_RESET_CLEANUP_RETENTION:P7D}

payment:
  gateway: ${PAYMENT_GATEWAY:mock}
  aba:
    environment: ${ABA_PAYWAY_ENVIRONMENT:sandbox}
    live-payments-enabled: ${ABA_PAYWAY_LIVE_PAYMENTS_ENABLED:false}
    base-url: ${ABA_PAYWAY_BASE_URL:https://checkout-sandbox.payway.com.kh}
    merchant-id: ${ABA_PAYWAY_MERCHANT_ID:}
    api-key: ${ABA_PAYWAY_API_KEY:}
    create-path: ${ABA_PAYWAY_CREATE_PATH:/api/payment-gateway/v1/payments/generate-qr}
    status-path: ${ABA_PAYWAY_STATUS_PATH:/api/payment-gateway/v1/payments/check-transaction-2}
    purchase-path: ${ABA_PAYWAY_PURCHASE_PATH:/api/payment-gateway/v1/payments/purchase}
    payment-option: ${ABA_PAYWAY_PAYMENT_OPTION:abapay_khqr}
    qr-image-template: ${ABA_PAYWAY_QR_IMAGE_TEMPLATE:template3_color}
    lifetime-minutes: ${ABA_PAYWAY_LIFETIME_MINUTES:30}
    callback-url: ${ABA_PAYWAY_CALLBACK_URL:http://localhost:8082/api/v1/payments/aba/callback}
    callback-secret: ${ABA_PAYWAY_CALLBACK_SECRET:}
    connect-timeout: ${ABA_PAYWAY_CONNECT_TIMEOUT:5s}
    read-timeout: ${ABA_PAYWAY_READ_TIMEOUT:15s}
    max-retries: ${ABA_PAYWAY_MAX_RETRIES:2}
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
    batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:50}
    fixed-delay: ${PAYMENT_RECONCILIATION_FIXED_DELAY:PT1M}
    initial-delay: ${PAYMENT_RECONCILIATION_INITIAL_DELAY:PT30S}
    min-age: ${PAYMENT_RECONCILIATION_MIN_AGE:PT1M}
  reconcile:
    cooldown: ${PAYMENT_RECONCILE_COOLDOWN:PT30S}

supplier:
  client: ${SUPPLIER_CLIENT:mock}
  max-attempts: ${SUPPLIER_MAX_ATTEMPTS:3}
  bay2game:
    enabled: ${BAY2GAME_ENABLED:false}
    provider-confirmed: ${BAY2GAME_PROVIDER_CONFIRMED:false}
    connect-timeout: ${BAY2GAME_CONNECT_TIMEOUT:3s}
    read-timeout: ${BAY2GAME_READ_TIMEOUT:10s}
  mock:
    fail: ${SUPPLIER_MOCK_FAIL:false}

fulfillment:
  worker:
    enabled: ${FULFILLMENT_WORKER_ENABLED:true}
    batch-size: ${FULFILLMENT_WORKER_BATCH_SIZE:50}
    fixed-delay: ${FULFILLMENT_WORKER_FIXED_DELAY:PT30S}
    initial-delay: ${FULFILLMENT_WORKER_INITIAL_DELAY:PT30S}
