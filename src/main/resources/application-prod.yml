# Production profile. Activated with SPRING_PROFILES_ACTIVE=prod (never "dev,prod").
#
# Every value that matters in production comes from the environment; nothing
# secret is written here. The base application.yml still supplies defaults for
# integrations that stay disabled at launch.
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # No localhost fallback: a missing datasource URL must fail startup, not
    # silently connect to a developer database. Supports both SPRING_DATASOURCE_* and DB_*.
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Connection timeout allows Neon serverless compute cold-starts
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    hibernate:
      # The schema is owned by Flyway. Startup validates entity mappings against
      # the migrated schema and never alters it.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
    connect-retries: 5

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  # Render and most PaaS providers inject PORT; the Compose file sets SERVER_PORT.
  # Local default stays 8082.
  port: ${PORT:${SERVER_PORT:8082}}
  address: 0.0.0.0
  # Finish in-flight requests on SIGTERM instead of dropping them.
  shutdown: graceful
  # Trust X-Forwarded-* from the TLS reverse proxy so audit logs and rate limits
  # see the real client address.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        # Render's health check uses /actuator/health/readiness. The other
        # actuator endpoints listed here are admin-authenticated in SecurityConfig.
        include: health,info,metrics
  endpoint:
    health:
      # Anonymous production callers only see UP/DOWN; never connection details.
      # An authenticated ADMIN can still inspect health components.
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true

app:
  dev-tools:
    # Mock payment confirmation and mock delivery routes must never exist in
    # production, even if an environment variable is set incorrectly.
    enabled: false
  cors:
    # Allowed storefront origins: defaults to Cloudflare Workers frontend, overridable by APP_CORS_ALLOWED_ORIGINS
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://gametopupkh.cheavsaren65.workers.dev}
  password-reset:
    frontend-base-url: ${APP_PASSWORD_RESET_FRONTEND_BASE_URL:${PASSWORD_RESET_FRONTEND_BASE_URL:https://gametopupkh.cheavsaren65.workers.dev}}

payment:
  gateway: ${PAYMENT_GATEWAY:mock}
  aba:
    environment: ${ABA_PAYWAY_ENVIRONMENT:sandbox}
    live-payments-enabled: false
  bakong:
    enabled: ${BAKONG_LIVE_ENABLED:${BAKONG_PAYMENT_ENABLED:false}}
  reconciliation:
    # Scheduled provider polling is disabled until a live gateway is approved.
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:false}

supplier:
  client: ${SUPPLIER_CLIENT:mock}

fulfillment:
  worker:
    # Automatic redelivery scans are off; a crash between PAID and delivery needs
    # a manual, audited retry while delivery is still simulated.
    enabled: ${FULFILLMENT_WORKER_ENABLED:false}

player:
  verification:
    # No authorized supplier lookup contract exists, so lookups report
    # UNAVAILABLE instead of trusting fixture data.
    mock-enabled: false

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  api-docs:
    enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
